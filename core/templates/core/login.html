<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login — Central de Cobranças</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f5f7;
        color: #1c1f26;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .cartao {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 32px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitulo { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .campo { margin-bottom: 16px; }
    .campo label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 600; }
    .campo input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        color: #1c1f26;
    }
    .erros {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 16px;
    }
    button {
        width: 100%;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 11px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .aviso {
        margin-top: 18px;
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
    }
</style>
</head>
<body>

<div class="cartao">
    <h1>Central de Cobranças</h1>
    <p class="subtitulo">Acesso restrito à equipe</p>

    {% if form.errors %}
    <div class="erros">Usuário ou senha inválidos. Tente novamente.</div>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="campo">
            <label for="username">Usuário</label>
            <input type="text" name="username" id="username" autofocus autocapitalize="none" autocomplete="username" required>
        </div>
        <div class="campo">
            <label for="password">Senha</label>
            <input type="password" name="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
